[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "与终端界面无关的 Git 仓库能力和应用服务"

[features]
developer-scheduler = []

[dependencies]
identity.workspace = true
i18n.workspace = true
anyhow.workspace = true
chrono.workspace = true
git2.workspace = true
libc.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sha2.workspace = true
shlex.workspace = true
tempfile.workspace = true
toml_edit.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
test-support.workspace = true
