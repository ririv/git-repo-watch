# 显式注册的仓库绝对路径，可用多行数组填写。
repositories = []

# 多仓库检查与写操作共用的并发上限，范围为 1 至 32。
max_concurrency = 4

# 启动时后台获取仓库的远程信息，默认关闭。
fetch_on_startup = false

# 文件文本预览和 diff 自动换行；关闭时使用横向滚动。
text_wrap = false
# git 沿用 GIT_EDITOR、core.editor、VISUAL、EDITOR 及 Git 的默认编辑器。
editor = "git"

# 文件列表显示类型图标，需要终端支持 Nerd Font 字形。
file_icons = true

# 实验性功能默认开启，当前包含 AI 编排提交。
experimental_features = true

# 中文界面中输入 、 打开命令菜单；英文界面不启用。
chinese_command_trigger = true

# 交互模式：application 由程序处理指针，text_selection 由终端处理选字和右键。
# 两种模式都保留键盘操作；Ctrl+G 切换并保存，下次启动沿用。
interaction_mode = "application"

# 视图偏好：切换后保存，下次启动沿用。
# 界面内自动获取：仅在窗口聚焦、仓库空闲时安排，默认关闭。
[auto_fetch]
enabled = false
# 默认 3 分钟，最短为 60 秒。支持 s、m、h、d、w。
interval_seconds = 180

[view]
# 文件列表：tree 为树形，flat 为平铺。
file_layout = "tree"
# diff 布局：auto、split 或 unified。
diff_layout = "auto"
# 原始 Git 文件头：collapsed 为收起，expanded 为展开；切换文件及重启后沿用。
diff_header = "collapsed"
# 差异显示范围：full 为完整源码，changes 为仅差异及少量上下文。
diff_context = "full"
# 仓库排序：priority、name、path 或 updated。
repository_order = "priority"

# 鼠标能力独立开关；键盘操作不受影响。
[mouse]
# 点击具体条目或滚动条定位，不自动执行仓库写操作。
precise_click = true
# 响应滚轮和触控板滚动（含横向滚动）。
scroll = true
# 点击或滚动时允许切换到指针所在的子视图。
select_pane = true

# AI 功能：显式选择本机 CLI；只在手动请求时调用，复用该 CLI 的登录与配置。
# 默认生成单行提交标题，结果仍需编辑和确认；不暂存文件、不执行提交或推送。
[ai]
# 仅在通用设置页切换；关闭后隐藏 AI 命令、功能和快捷键。
enabled = true
agent = "codex"

# 完整生成指令：default 使用内置指令，custom 完整替换；自定义文本支持 TOML 多行字符串。
[ai.prompt]
mode = "default"
# mode = "custom"
# text = "根据暂存差异生成单行中文提交标题，使用 Conventional Commits。"

[ai.codex]
# 仅通过当前 PATH 查找 codex，不配置程序路径。
# 空字符串沿用 agent 自己的默认模型。
model = ""

[ai.claude]
# 仅通过当前 PATH 查找 claude。
model = ""
