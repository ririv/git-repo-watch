[workspace]
members = [".", "crates/engine", "crates/tui", "crates/graph", "crates/highlight", "crates/test-support", "crates/i18n", "crates/identity"]
default-members = [".", "crates/engine", "crates/tui", "crates/graph", "crates/highlight", "crates/i18n", "crates/identity"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
identity = { path = "crates/identity" }
i18n = { path = "crates/i18n" }
engine = { path = "crates/engine" }
tui = { path = "crates/tui" }
highlight = { path = "crates/highlight" }
graph = { path = "crates/graph" }
test-support = { path = "crates/test-support" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.29"
ctrlc = "3"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
libc = "0.2"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strip-ansi-escapes = "0.2"
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-themes", "regex-onig"] }
tempfile = "3"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
unicode-width = "0.2"
vte = { version = "0.14", default-features = false }

[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "多仓库 Git 管理工具的 CLI 和程序入口"

[dependencies]
identity.workspace = true
i18n.workspace = true
engine.workspace = true
tui.workspace = true
anyhow.workspace = true
chrono.workspace = true
ctrlc.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
libc.workspace = true
tempfile.workspace = true

[profile.release]
lto = "thin"
strip = "debuginfo"
