[workspace]
members = [".", "crates/gw-core", "crates/gw-tui", "crates/gw-test-support"]
default-members = [".", "crates/gw-core", "crates/gw-tui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
gw-core = { path = "crates/gw-core" }
gw-tui = { path = "crates/gw-tui" }
gw-test-support = { path = "crates/gw-test-support" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.29"
ctrlc = "3"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
libc = "0.2"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strip-ansi-escapes = "0.2"
tempfile = "3"
unicode-width = "0.2"

[package]
name = "gw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "多仓库 Git 管理工具的 CLI 和程序入口"

[dependencies]
gw-core.workspace = true
gw-tui.workspace = true
anyhow.workspace = true
chrono.workspace = true
ctrlc.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
libc.workspace = true
tempfile.workspace = true

[profile.release]
lto = "thin"
strip = "debuginfo"
